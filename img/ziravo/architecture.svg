<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" role="img" aria-label="Architecture de Ziravo : à chaque push, GitHub Actions vérifie les types et rejoue tous les exercices, puis publie l'application sur Cloudflare Pages ; le terminal simulé tourne dans le navigateur ; Supabase garde les comptes et la progression.">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e96"/></marker>
    <style>
      .box{fill:#fff;stroke:#c9d3e3;stroke-width:1.5}
      .zone{fill:#f3f6fb;stroke:#1f4e96;stroke-width:1.5;stroke-dasharray:5 4}
      .t{font-size:15px;font-weight:700;fill:#16202e}
      .s{font-size:12.5px;fill:#5b6676}
      .z{font-size:13px;font-weight:700;fill:#1f4e96;letter-spacing:.4px}
      .a{stroke:#1f4e96;stroke-width:2;fill:none;marker-end:url(#fl)}
      .ok{fill:#e8f5ee;stroke:#2e8b57}
      .term{fill:#16202e;stroke:#16202e}
      .tw{font-size:15px;font-weight:700;fill:#fff}
      .tg{font-size:12.5px;fill:#9fe0b8;font-family:ui-monospace, Menlo, Consolas, monospace}
      .ts{font-size:12.5px;fill:#c9d3e3}
    </style>
  </defs>

  <rect class="zone" x="10" y="10" width="300" height="410" rx="16"/>
  <text class="z" x="28" y="36">À CHAQUE PUSH · GITHUB ACTIONS</text>
  <rect class="box" x="30" y="52" width="260" height="236" rx="12"/>
  <text class="t" x="46" y="76">Contrôles automatiques</text>
  <text class="s" x="46" y="100">types TypeScript et lint</text>
  <text class="s" x="46" y="124">les 5 662 exercices rejoués :</text>
  <text class="s" x="46" y="142">  chaque commande de référence</text>
  <text class="s" x="46" y="160">  doit marcher dans le terminal</text>
  <text class="s" x="46" y="184">test de positionnement cohérent</text>
  <text class="s" x="46" y="208">monnaie du jeu équilibrée</text>
  <text class="s" x="46" y="232">fonctions serveur vérifiées</text>
  <text class="s" x="46" y="256">export web de l’application</text>
  <text class="s" x="46" y="276">tout vert = déploiement</text>
  <rect class="box ok" x="30" y="310" width="260" height="90" rx="12"/>
  <text class="t" x="46" y="334">Déploiement automatique</text>
  <text class="s" x="46" y="358">l’application et le site vitrine</text>
  <text class="s" x="46" y="378">publiés sur Cloudflare Pages</text>

  <rect class="zone" x="350" y="10" width="600" height="410" rx="16"/>
  <text class="z" x="368" y="36">EN PRODUCTION</text>
  <rect class="box" x="370" y="52" width="260" height="70" rx="12"/>
  <text class="t" x="386" y="76">Joueurs</text>
  <text class="s" x="386" y="96">téléphone ou ordinateur</text>
  <text class="s" x="386" y="112">rien à installer</text>
  <path class="a" d="M500,122 V146"/>
  <rect class="box" x="370" y="150" width="260" height="78" rx="12"/>
  <text class="t" x="386" y="174">Cloudflare Pages</text>
  <text class="s" x="386" y="194">app.ziravo.fr : application web</text>
  <text class="s" x="386" y="212">statique (Expo, React Native Web)</text>
  <path class="a" d="M500,228 V252"/>
  <rect class="box term" x="370" y="256" width="260" height="144" rx="12"/>
  <circle cx="390" cy="274" r="5" fill="#ff5f57"/><circle cx="406" cy="274" r="5" fill="#febc2e"/><circle cx="422" cy="274" r="5" fill="#28c840"/>
  <text class="tw" x="386" y="304">Terminal simulé (navigateur)</text>
  <text class="tg" x="386" y="328">$ kubectl get pods</text>
  <text class="ts" x="386" y="352">shell, services, disques, Docker,</text>
  <text class="ts" x="386" y="370">Git, Kubernetes, cloud simulé…</text>
  <text class="ts" x="386" y="388">aucun vrai serveur à casser</text>

  <rect class="box" x="670" y="52" width="260" height="176" rx="12"/>
  <text class="t" x="686" y="76">Supabase</text>
  <text class="s" x="686" y="100">comptes et progression</text>
  <text class="s" x="686" y="120">Row-Level Security :</text>
  <text class="s" x="686" y="138">  chacun ne lit que ses données</text>
  <text class="s" x="686" y="162">suppression de compte</text>
  <text class="s" x="686" y="180">comptes invités purgés</text>
  <text class="s" x="686" y="204">tâches planifiées (pg_cron)</text>
  <path class="a" d="M630,189 H666"/>
  <rect class="box" x="670" y="256" width="260" height="144" rx="12"/>
  <text class="t" x="686" y="280">Premium</text>
  <text class="s" x="686" y="304">paiement Stripe traité par</text>
  <text class="s" x="686" y="322">des fonctions serveur</text>
  <text class="s" x="686" y="340">(webhook signé)</text>
  <text class="s" x="686" y="364">aucune clé secrète</text>
  <text class="s" x="686" y="382">dans l’application ni le dépôt</text>
  <path class="a" d="M800,228 V252"/>
  <path class="a" d="M290 355 H322 Q330 355 330 347 V197 Q330 189 338 189 H366"/>
  <text x="344" y="272" font-size="11" fill="#1f4e96" font-weight="600" text-anchor="middle" transform="rotate(-90 344 272)">publication</text>
</svg>
